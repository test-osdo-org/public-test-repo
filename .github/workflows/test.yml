name: "Project: Test"
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Expected PR HEAD SHA'
        required: false
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    environment: trusted-pr-deployment
    steps:
      - name: Run tests
        run: |
          echo "=== Trusted PR Front-Door Gate: Test ==="
          echo "SHA: $GITHUB_SHA"
          echo ""
          echo "This workflow PROVES the front-door hold mechanism."
          echo "It was held in action_required state until released by /trusted-run."
          echo ""
          echo "Tests complete — PASS"
