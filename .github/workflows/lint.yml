name: "Project: Lint"
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Lint check
        run: |
          echo "=== Trusted PR Front-Door Gate: Lint ==="
          echo "SHA: $GITHUB_SHA"
          echo ""
          echo "WARNING: This job has NO environment: declaration."
          echo "It is NOT protected by the DPR gate."
          echo "It will execute after any workflow approval — including a human bypass."
          echo ""
          echo "Lint complete — PASS (but UNPROTECTED)"
